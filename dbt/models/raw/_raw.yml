version: 2

sources:
  - name: raw
    description: >
      External tables over the Hive-partitioned GCS landing zone. Layout:
        source=<s>/feed=<f>/type=<t>/v=<n>/load_date=<YYYY-MM-DD>/load_epoch=<sec>/<file>
      The hive_partition_uri_prefix is scoped per source down to v=<n>/, so
      source/feed/type/v are constants baked into the prefix and only
      load_date + load_epoch are partition columns. This keeps each external
      table's partition schema trivial and avoids BigQuery mis-inferring the
      key order when many source= branches share one bucket root.
      Add a new feed = add a source block; add a new load = drop a new
      load_date=/load_epoch= folder (staging keeps only the latest load).
    database: "{{ var('gcp_project') }}"
    schema: dbt_raw
    loader: gcloud storage

    tables:
      - name: meta_spend_export
        description: Daily Meta spend, nested API pull (NDJSON).
        config:
          loaded_at_field: "CAST(`date` AS TIMESTAMP)"
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 2, period: day}
        external:
          location: "gs://{{ var('raw_bucket') }}/source=meta/feed=spend/type=daily/v=1/*"
          options:
            format: newline_delimited_json
            hive_partition_uri_prefix: "gs://{{ var('raw_bucket') }}/source=meta/feed=spend/type=daily/v=1/"

      - name: tiktok_spend_hourly
        description: Hourly TikTok spend (CSV), UTC, account currency.
        config:
          loaded_at_field: "CAST(stat_hour_utc AS TIMESTAMP)"
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 2, period: hour}
        external:
          location: "gs://{{ var('raw_bucket') }}/source=tiktok/feed=spend/type=hourly/v=1/*"
          options:
            format: csv
            skip_leading_rows: 1
            hive_partition_uri_prefix: "gs://{{ var('raw_bucket') }}/source=tiktok/feed=spend/type=hourly/v=1/"

      - name: google_ads_spend
        description: Daily Google Ads spend (CSV), cost in micros.
        config:
          loaded_at_field: "CAST(`date` AS TIMESTAMP)"
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 2, period: day}
        external:
          location: "gs://{{ var('raw_bucket') }}/source=google/feed=spend/type=daily/v=1/*"
          options:
            format: csv
            skip_leading_rows: 1
            hive_partition_uri_prefix: "gs://{{ var('raw_bucket') }}/source=google/feed=spend/type=daily/v=1/"

      - name: attribution_events
        description: MMP install/trial/purchase events (CSV).
        config:
          loaded_at_field: "CAST(received_at_utc AS TIMESTAMP)"
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 2, period: hour}
        external:
          location: "gs://{{ var('raw_bucket') }}/source=measurement_partner/feed=events/type=event/v=1/*"
          options:
            format: csv
            skip_leading_rows: 1
            hive_partition_uri_prefix: "gs://{{ var('raw_bucket') }}/source=measurement_partner/feed=events/type=event/v=1/"

      - name: billing_transactions
        description: Billing charges/refunds (NDJSON), USD.
        config:
          loaded_at_field: "CAST(created_at_utc AS TIMESTAMP)"
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 2, period: hour}
        external:
          location: "gs://{{ var('raw_bucket') }}/source=billing_partner/feed=transactions/type=transaction/v=1/*"
          options:
            format: newline_delimited_json
            hive_partition_uri_prefix: "gs://{{ var('raw_bucket') }}/source=billing_partner/feed=transactions/type=transaction/v=1/"

      - name: forex_rates
        description: Daily FX rates (CSV), usd_rate = USD per 1 unit currency.
        config:
          loaded_at_field: "CAST(`date` AS TIMESTAMP)"
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 2, period: day}
        external:
          location: "gs://{{ var('raw_bucket') }}/source=forex_partner/feed=rates/type=daily/v=1/*"
          options:
            format: csv
            skip_leading_rows: 1
            hive_partition_uri_prefix: "gs://{{ var('raw_bucket') }}/source=forex_partner/feed=rates/type=daily/v=1/"

      - name: platform_daily_totals
        description: Ground-truth daily platform spend (CSV), USD, NY dates.
        config:
          loaded_at_field: "CAST(`date` AS TIMESTAMP)"
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 2, period: day}
        external:
          location: "gs://{{ var('raw_bucket') }}/source=platform/feed=totals/type=daily/v=1/*"
          options:
            format: csv
            skip_leading_rows: 1
            hive_partition_uri_prefix: "gs://{{ var('raw_bucket') }}/source=platform/feed=totals/type=daily/v=1/"
