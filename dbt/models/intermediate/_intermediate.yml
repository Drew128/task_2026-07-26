version: 2

models:
  - name: intermediate__first_touch
    description: One row per user — earliest install → first-touch campaign.
    columns:
      - name: user_id
        description: Join key to events/billing; must be unique (one row per user).
        data_tests:
          - not_null
          - unique

  - name: intermediate__spend_daily
    columns:
      - name: channel
        # NULL channel = an ad account is spending but is missing from the
        # account_channel_map seed → we forgot to onboard it
        data_tests:
          - not_null
